<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>*,*::before,*::after{box-sizing:border-box}html{color-scheme:light}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Keto Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: slim header with search and list button; home asks "What would you like?" with simple category tiles (or rows); a category shows a clean list of recipes; tapping one opens a single recipe page with ingredients first. */
:root{
  --bg:#F6F1EA; --surface:#FFFDF9; --ink:#2A211A; --muted:#7A6D60; --line:#E8DFD3; --accent:#9C4A28; --accent-ink:#FFFDF9; --soft:#F0E6D8;
  --warn:#8A4B00; --warn-bg:#FBEBD0;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
}
body.s-a{--bg:#FFFFFF; --surface:#FFFFFF; --ink:#1E1B18; --muted:#6E675F; --line:#ECE8E3; --accent:#B4552F; --accent-ink:#FFFFFF; --soft:#F6F3EF}
body.s-c{--bg:#FBF8F3; --surface:#FBF8F3; --ink:#26201A; --muted:#7C7064; --line:#DDD3C6; --accent:#5F6B34; --accent-ink:#FBF8F3; --soft:#F1ECE3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{
  --bg:#1B1714; --surface:#231E1A; --ink:#F0E8DE; --muted:#B3A595; --line:#3A322B; --accent:#E3916A; --accent-ink:#1B1714; --soft:#2C2620; --warn:#F2C27C; --warn-bg:#382A16; color-scheme:dark}
 :root:not([data-theme="light"]) body.s-c{--accent:#B5C27A}}
:root[data-theme="dark"] body{
  --bg:#1B1714; --surface:#231E1A; --ink:#F0E8DE; --muted:#B3A595; --line:#3A322B; --accent:#E3916A; --accent-ink:#1B1714; --soft:#2C2620; --warn:#F2C27C; --warn-bg:#382A16; color-scheme:dark}
:root[data-theme="dark"] body.s-c{--accent:#B5C27A}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;text-decoration:none;margin-right:auto;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.listbtn{border:none;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;cursor:pointer}
.listbtn b{font-variant-numeric:tabular-nums;margin-left:4px;opacity:.75}
#q{flex:1 1 100%;order:3;min-width:0;font:inherit;font-size:1rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px}

main{padding-block:28px 72px}
main .wrap{display:grid;gap:22px}
.ask{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;line-height:1.1}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:6px 0 -8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:grid;gap:14px;transition:border-color .15s}
.tile svg{width:28px;height:28px;color:var(--accent)}
.tile strong{display:block;font-weight:600;font-size:1.02rem;line-height:1.25}
.tile span{font-size:.82rem;color:var(--muted)}
@media (hover:hover){.tile:hover{border-color:var(--accent)}}
body.s-a .tile{background:var(--soft);border-color:transparent}
body.s-c .tiles{grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
body.s-c .tile{grid-template-columns:28px 1fr auto;align-items:center;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:14px 2px;background:none}
body.s-c .tile strong{font-family:var(--display);font-size:1.3rem;font-weight:600}
body.s-c .tile span{font-size:.9rem}

.back{border:none;background:none;padding:0;color:var(--muted);cursor:pointer;font-size:.95rem;justify-self:start}
.ttl{display:grid;gap:4px}
.ttl h2{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1}
.ttl p{margin:0;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows button{width:100%;border:none;background:none;text-align:left;cursor:pointer;padding:14px 2px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.rows strong{font-weight:600;font-size:1.05rem;line-height:1.3}
.rows small{grid-column:1;color:var(--muted);font-size:.85rem}
.rows .chev{grid-row:1 / span 2;grid-column:2;color:var(--muted)}
.rows .on{color:var(--accent);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin:0 6px 1px 0;vertical-align:middle}

.recipe{display:grid;gap:22px}
.recipe h2{font-size:clamp(2rem,7vw,2.8rem);line-height:1.08}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.95rem}
.warns{display:grid;gap:8px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.93rem;font-weight:500}
.sec h3{font-size:1.25rem;margin-bottom:8px}
.ing{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ing li{padding:11px 0;border-bottom:1px solid var(--line);font-size:1.05rem}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.15rem;line-height:1.5}
.tips{margin:0;padding-left:1.2em;display:grid;gap:6px;color:var(--muted)}
.add{width:100%;border:none;border-radius:14px;padding:14px;font-weight:600;font-size:1rem;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.add[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.src{font-size:.85rem;color:var(--muted)}

.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.items li{border-bottom:1px solid var(--line)}
.items label{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer;font-size:1.02rem}
.items input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.items input:checked + span{text-decoration:line-through;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem;cursor:pointer}
.empty{color:var(--muted);padding:24px 0}
footer{padding-block:24px 40px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
footer p{margin:0}
@media (min-width:700px){#q{flex:0 1 280px;order:0}}
</style>
</head>
<body>


<header class="gut">
  <div class="wrap">
    <a class="brand" href="#">Keto <i>Kitchen</i></a>
    <input id="q" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes">
    <button class="listbtn" id="listBtn">Shopping list<b id="count">0</b></button>
  </div>
</header>

<main class="gut"><div class="wrap" id="view"></div></main>

in salt from the kimchi and soy.", "Fairly high in calories (about 565 a serve)."], "types": ["Soups", "Pork"], "time": "25 min"}, {"id": "shabu-shabu", "name": "Shabu shabu hotpot", "source": {"label": "Made for your tastes"}, "meal": ["Dinner"], "servings": 4, "perServing": {"netCarbs": 7, "protein": 41, "fat": 23, "kcal": 400}, "rating": "good", "verdict": "Fun to eat at the table and very low carb. Bottled ponzu and sesame dipping sauces often have added sugar, so make the simple dipping sauce below instead.", "ingredients": ["600 g shabu shabu beef (very thinly sliced scotch fillet, from an Asian grocer)", "1 piece kombu (dried kelp), about 10 cm", "1.5 L water", "300 g firm tofu, cubed", "1/4 wombok (about 400 g), chopped", "200 g fresh shiitake mushrooms", "100 g enoki mushrooms", "2 baby bok choy, halved", "4 spring onions, cut into lengths", "Dipping sauce: 4 tbsp tamari or soy sauce, 2 tbsp lemon juice, 1 tsp grated ginger, sliced spring onion"], "method": ["Soak the kombu in the water for 30 minutes, then bring it slowly to a simmer and remove the kombu just before it boils.", "Mix the dipping sauce and divide into small bowls.", "Arrange the beef and vegetables on platters.", "Keep the broth simmering at the table (a portable burner works best). Add vegetables, tofu and mushrooms first.", "Each person swishes a slice of beef in the broth for 10 to 20 seconds until just cooked, then dips it in the sauce.", "Drink the rich broth at the end as soup."], "tips": ["Use thinly sliced pork belly instead of beef for a change.", "Leftover broth makes a great base for the egg drop soup."], "added": "2026-11-24", "warnings": [], "types": ["Soups", "Steak & beef"], "time": "45 min"}, {"id": "pork-mushroom-miso-soup", "name": "Pork and mushroom miso soup", "source": {"label": "Made for your tastes"}, "meal": ["Lunch", "Dinner"], "servings": 4, "perServing": {"netCarbs": 7, "protein": 16, "fat": 44, "kcal": 485}, "rating": "good", "verdict": "A hearty Japanese pork miso soup (tonjiru) without the potato and carrot. Miso has some carbs, so stick to about 3 tablespoons for the pot. Freezes well; add the miso when you reheat if you can.", "ingredients": ["300 g pork belly, thinly sliced", "1 L dashi or chicken stock", "3 tbsp white or red miso paste", "200 g mixed mushrooms (shiitake and shimeji or oyster), sliced", "100 g daikon (white radish), cut into thin half-moons", "200 g firm tofu, cubed", "2 cups wombok (Chinese cabbage), chopped", "1 tsp sesame oil", "2 spring onions, sliced", "Shichimi or chilli flakes, to serve"], "method": ["Heat the sesame oil in a pot and fry the pork 3 minutes until it starts to brown.", "Add the mushrooms and daikon and fry 2 minutes.", "Pour in the dashi, bring to the boil, skim off any foam and simmer 10 minutes until the daikon is tender.", "Add the tofu and cabbage and simmer 3 minutes.", "Turn the heat to low. Mix the miso with a ladle of broth until smooth, then stir it in. Don't let it boil after this.", "Serve topped with spring onion and shichimi."], "tips": ["Use pork shoulder instead of belly for a leaner soup with more protein."], "added": "2026-11-24", "warnings": ["High in salt from the miso and dashi. Use salt-reduced dashi or stock."], "types": ["Soups", "Pork"], "time": "25 min"}, {"id": "egg-drop-soup", "name": "Mushroom egg drop soup", "source": {"label": "Made for your tastes"}, "meal": ["Lunch", "Snack"], "servings": 2, "perServing": {"netCarbs": 4, "protein": 14, "fat": 10, "kcal": 160}, "rating": "good", "verdict": "Ready in 5 to 10 minutes and very low carb. It's light, so add shredded chicken or prawns to make it a meal. Restaurant versions are thickened with cornflour; this one isn't.", "ingredients": ["750 ml chicken stock (salt-reduced)", "3 eggs, beaten", "100 g shiitake mushrooms, sliced", "1 tsp grated ginger", "1 tbsp tamari or soy sauce", "1 tsp sesame oil", "2 spring onions, sliced", "White pepper"], "method": ["Bring the stock, ginger, tamari and mushrooms to a simmer and cook 3 minutes.", "Stir the soup in a circle, then slowly pour in the beaten eggs in a thin stream so they form ribbons.", "Leave it for 30 seconds, then stir gently.", "Add the sesame oil, white pepper and spring onion and serve."], "tips": ["Add 150 g shredded cooked chicken to bring the protein up to about 30 g a serve.", "Leftover shabu shabu broth makes it even better."], "added": "2026-11-24", "warnings": ["Low in protein and calories on its own. Add chicken or prawns to make it a meal."], "types": ["Soups", "Eggs", "Quick & easy"], "time": "10 min"}, {"id": "mushroom-spinach-omelette", "name": "Mushroom and spinach omelette", "source": {"label": "Made for your tastes"}, "meal": ["Breakfast", "Lunch"], "types": ["Eggs", "Quick & easy"], "time": "10 min", "servings": 1, "perServing": {"netCarbs": 2, "kcal": 350}, "rating": "good", "verdict": "", "ingredients": ["3 eggs", "15 g butter", "80 g mushrooms, sliced", "1 handful baby spinach", "1 tbsp chives, chopped", "Salt and pepper"], "method": ["Melt half the butter in a non-stick pan over medium-high heat and cook the mushrooms 3 minutes until golden. Add the spinach until it wilts, then tip out.", "Beat the eggs with salt and pepper.", "Melt the rest of the butter, pour in the eggs and stir gently for 20 seconds, then let it set.", "Spoon the mushrooms and spinach over one half, fold over and slide onto a plate. Top with chives."], "tips": ["Add a few slices of ham or leftover steak for a bigger meal."], "warnings": [], "added": "2026-11-24"}, {"id": "korean-steamed-egg", "name": "Korean steamed egg (gyeran jjim)", "source": {"label": "Made for your tastes"}, "meal": ["Breakfast", "Lunch"], "types": ["Eggs", "Quick & easy", "Veg & sides"], "time": "15 min", "servings": 2, "perServing": {"netCarbs": 1, "kcal": 170}, "rating": "good", "verdict": "", "ingredients": ["4 eggs", "200 ml chicken stock or water", "1 tsp fish sauce or 1/2 tsp salt", "1 spring onion, finely sliced", "1 tsp sesame oil", "Pinch of chilli flakes and sesame seeds"], "method": ["Whisk the eggs, stock and fish sauce until smooth.", "Pour into a small heatproof bowl or claypot and stir in most of the spring onion.", "Steam over simmering water, covered, for 10 to 12 minutes until just set and puffy (or cook in a small pot on low heat with the lid on).", "Drizzle with sesame oil and top with the rest of the spring onion, chilli and sesame seeds."], "tips": ["Great next to bulgogi or pork belly."], "warnings": [], "added": "2026-11-24"}, {"id": "soy-marinated-eggs", "name": "Soy-marinated eggs", "source": {"label": "Made for your tastes"}, "meal": ["Snack", "Breakfast"], "types": ["Eggs", "Snacks"], "time": "15 min + 4 hr soak", "servings": 6, "perServing": {"netCarbs": 1, "kcal": 80}, "rating": "good", "verdict": "", "ingredients": ["6 eggs", "125 ml tamari or soy sauce", "125 ml water", "1 tbsp granulated sweetener (optional, instead of sugar)", "2 garlic cloves, sliced", "1 long red chilli, sliced", "2 spring onions, sliced", "1 tsp sesame seeds"], "method": ["Boil the eggs for 6 1/2 minutes for jammy yolks, then put them straight into iced water. Peel.", "Mix the tamari, water, sweetener, garlic, chilli and spring onion in a container.", "Add the eggs, cover and refrigerate at least 4 hours or overnight. Sprinkle with sesame seeds to serve."], "tips": ["Keeps 3 days in the fridge. Great with the steamed egg or in soups."], "warnings": ["The marinade is very salty. Eat 1 or 2 at a time and don't drink the marinade."], "added": "2026-11-24"}, {"id": "bacon-egg-cups", "name": "Bacon and egg cups", "source": {"label": "Made for your tastes"}, "meal": ["Breakfast", "Snack"], "types": ["Eggs", "Pork", "Quick & easy"], "time": "25 min", "servings": 3, "perServing": {"netCarbs": 1, "kcal": 250}, "rating": "good", "verdict": "", "ingredients": ["6 short-cut bacon rashers", "6 eggs", "1 handful baby spinach, chopped", "1 tbsp chives, chopped", "Oil spray", "Salt and pepper"], "method": ["Heat the oven to 200°C fan-forced. Spray 6 holes of a muffin tin.", "Line each hole with a bacon rasher to make a cup. Add a little spinach.", "Crack an egg into each and season.", "Bake 12 to 15 minutes until the whites are set. Top with chives."], "tips": ["Make a batch on Sunday. They keep 3 days in the fridge and reheat in 30 seconds."], "warnings": ["Bacon is processed and salty. Fine a few times a week, not every day."], "added": "2026-11-24"}, {"id": "bulgogi-lettuce-cups", "name": "Beef bulgogi lettuce cups", "source": {"label": "Made for your tastes"}, "meal": ["Dinner", "Lunch"], "types": ["Steak & beef", "Quick & easy"], "time": "20 min + 30 min marinate", "servings": 4, "perServing": {"netCarbs": 4, "kcal": 360}, "rating": "good", "verdict": "", "ingredients": ["600 g scotch fillet or rump, very thinly sliced (or bulgogi beef from an Asian grocer)", "3 tbsp tamari or soy sauce", "1 tbsp sesame oil", "3 garlic cloves, minced", "1 tbsp grated ginger", "1 tsp granulated sweetener (optional, instead of sugar and pear)", "1/2 tsp black pepper", "3 spring onions, sliced", "1 butter lettuce, leaves separated", "1 Lebanese cucumber, cut into sticks", "Kimchi and sesame seeds, to serve"], "method": ["Mix the tamari, sesame oil, garlic, ginger, sweetener and pepper. Toss through the beef and leave 30 minutes (or overnight).", "Heat a large frying pan until very hot. Cook the beef in two batches for 2 to 3 minutes until browned.", "Toss through the spring onion.", "Serve in lettuce leaves with cucumber, kimchi and sesame seeds."], "tips": ["Pork shoulder slices work too (that's dwaeji bulgogi). Add 1 tsp gochugaru for spice."], "warnings": [], "added": "2026-11-24"}, {"id": "pork-larb", "name": "Pork larb lettuce cups", "source": {"label": "Made for your tastes"}, "meal": ["Lunch", "Dinner"], "types": ["Pork", "Quick & easy"], "time": "15 min", "servings": 4, "perServing": {"netCarbs": 4, "kcal": 330}, "rating": "good", "verdict": "", "ingredients": ["500 g pork mince", "1 tbsp oil", "2 tbsp fish sauce", "3 tbsp lime juice", "2 eschalots, thinly sliced", "1 stalk lemongrass, finely chopped (or 1 tbsp paste)", "1/2 tsp chilli flakes", "1 large handful mint leaves", "1 large handful coriander", "2 spring onions, sliced", "1 iceberg or cos lettuce, leaves separated", "1 Lebanese cucumber, sliced"], "method": ["Heat the oil in a frying pan over high heat. Add the pork and lemongrass and cook 6 to 8 minutes, breaking it up, until cooked and a little crispy.", "Take off the heat. Stir in the fish sauce, lime juice, chilli and eschalots.", "Toss through the herbs and spring onion.", "Spoon into lettuce cups and serve with cucumber."], "tips": ["Chicken or beef mince work just as well.", "The traditional version uses toasted rice powder; leave it out."], "warnings": [], "added": "2026-11-24"}, {"id": "sheet-pan-chicken-thighs", "name": "Sheet-pan chicken thighs with mushrooms and broccoli", "source": {"label": "Made for your tastes"}, "meal": ["Dinner"], "types": ["Chicken", "Quick & easy"], "time": "45 min", "servings": 4, "perServing": {"netCarbs": 6, "kcal": 580}, "rating": "good", "verdict": "", "ingredients": ["8 chicken thighs, bone in and skin on (about 1.2 kg)", "400 g mushrooms (cup or Swiss brown), halved", "1 head broccoli (about 400 g), cut into florets", "4 garlic cloves, smashed", "2 tbsp olive oil", "1 lemon, halved", "4 sprigs thyme or rosemary", "Salt and pepper"], "method": ["Heat the oven to 220°C fan-forced.", "Rub the chicken with half the oil, salt and pepper and put skin side up on a large tray. Roast 20 minutes.", "Toss the mushrooms, broccoli and garlic with the rest of the oil and add to the tray with the herbs and lemon.", "Roast 20 minutes more until the skin is crisp and the chicken is cooked through. Squeeze the roasted lemon over."], "tips": ["One tray, almost no washing up. Leftovers are great in the egg drop soup."], "warnings": ["Fairly high in calories (about 580 a serve) because of the skin. Remove the skin for a lighter meal."], "added": "2026-11-24"}, {"id": "garlic-chilli-calamari", "name": "Garlic chilli calamari", "source": {"label": "Made for your tastes"}, "meal": ["Lunch", "Dinner"], "types": ["Seafood", "Quick & easy"], "time": "15 min", "servings": 2, "perServing": {"netCarbs": 6, "kcal": 330}, "rating": "good", "verdict": "", "ingredients": ["500 g squid tubes, cleaned", "2 tbsp olive oil", "3 garlic cloves, sliced", "1 long red chilli, sliced", "1 lemon", "2 tbsp parsley, chopped", "2 handfuls rocket", "Salt and pepper"], "method": ["Cut the squid open, score the inside in a criss-cross pattern and cut into pieces. Pat dry and season.", "Heat a large frying pan until smoking. Add half the oil and the squid and cook 1 to 2 minutes until it curls and turns white. Don't overcook.", "Lower the heat, add the rest of the oil, garlic and chilli for 30 seconds.", "Squeeze in lemon, toss through parsley and serve on rocket."], "tips": ["Frozen squid tubes from the supermarket are cheap and work well."], "warnings": [], "added": "2026-11-24"}, {"id": "tuna-stuffed-avocado", "name": "Tuna-stuffed avocado", "source": {"label": "Made for your tastes"}, "meal": ["Lunch", "Snack"], "types": ["Seafood", "Quick & easy"], "time": "5 min", "servings": 1, "perServing": {"netCarbs": 4, "kcal": 480}, "rating": "good", "verdict": "", "ingredients": ["1 ripe avocado, halved, stone removed", "1 tin tuna in olive oil (95 g), drained", "1/4 Lebanese cucumber, finely diced", "1 tsp capers, chopped", "1 spring onion, sliced", "Squeeze of lemon", "Pinch of chilli flakes, salt and pepper"], "method": ["Mix the tuna, cucumber, capers, spring onion, lemon, chilli, salt and pepper.", "Pile into the avocado halves and eat with a spoon."], "tips": ["Swap the tuna for tinned salmon or smoked trout."], "warnings": [], "added": "2026-11-24"}, {"id": "prosciutto-asparagus", "name": "Prosciutto-wrapped asparagus", "source": {"label": "Made for your tastes"}, "meal": ["Snack"], "types": ["Pork", "Snacks", "Veg & sides"], "time": "15 min", "servings": 2, "perServing": {"netCarbs": 3, "kcal": 180}, "rating": "good", "verdict": "", "ingredients": ["1 bunch asparagus (about 12 spears), woody ends snapped off", "6 slices prosciutto, halved lengthways", "1 tbsp olive oil", "Lemon wedges and pepper, to serve"], "method": ["Heat the oven to 200°C fan-forced.", "Wrap each spear in a strip of prosciutto. Lay on a tray and drizzle with oil.", "Bake 10 to 12 minutes until the prosciutto is crisp. Serve with lemon and pepper."], "tips": ["Also good wrapped around green beans or with a soft-boiled egg for dipping."], "warnings": ["Prosciutto is cured and salty. Keep it to snack-sized portions."], "added": "2026-11-24"}, {"id": "dark-chocolate-bark", "name": "Dark chocolate nut bark", "source": {"label": "Made for your tastes"}, "meal": ["Dessert", "Snack"], "types": ["Desserts"], "time": "15 min + 1 hr set", "servings": 12, "perServing": {"netCarbs": 3, "kcal": 135}, "rating": "good", "verdict": "", "ingredients": ["200 g dark chocolate, 85% cocoa or higher (e.g. Lindt 90%)", "50 g almonds, roughly chopped", "40 g macadamias, roughly chopped", "1 tbsp pumpkin seeds", "Pinch of flaky salt"], "method": ["Line a tray with baking paper.", "Melt the chocolate in a bowl over simmering water (or in 20-second bursts in the microwave).", "Spread thinly on the tray and scatter over the nuts, seeds and salt.", "Refrigerate 1 hour until set, then break into 12 pieces. Keep in the fridge."], "tips": ["Freeze half so it's not all in reach."], "warnings": ["High in calories (about 135 a piece). Stick to 1 or 2 pieces.", "Use 85% cocoa or higher. 70% chocolate has much more sugar."], "added": "2026-11-24"}, {"id": "coffee-jelly", "name": "Coffee jelly", "source": {"label": "Made for your tastes"}, "meal": ["Dessert"], "types": ["Desserts"], "time": "10 min + 3 hr set", "servings": 4, "perServing": {"netCarbs": 0, "kcal": 15}, "rating": "good", "verdict": "", "ingredients": ["500 ml strong black coffee (decaf for evenings)", "3 tsp powdered gelatine", "2 tbsp granulated sweetener (erythritol or allulose)", "Optional: a splash of unsweetened almond milk to serve"], "method": ["Sprinkle the gelatine over 60 ml of the coffee and leave 5 minutes to soften.", "Heat the rest of the coffee until hot but not boiling. Stir in the softened gelatine and sweetener until dissolved.", "Pour into 4 small glasses or a dish and refrigerate 3 hours until set.", "Serve as is, or cut into cubes with a splash of almond milk."], "tips": ["A light Japanese-style dessert that's almost zero carb."], "warnings": ["Contains caffeine. Use decaf if you're having it at night."], "added": "2026-11-24"}, {"id": "chocolate-strawberries", "name": "Dark chocolate strawberries", "source": {"label": "Made for your tastes"}, "meal": ["Dessert"], "types": ["Desserts"], "time": "15 min", "servings": 4, "perServing": {"netCarbs": 6, "kcal": 120}, "rating": "good", "verdict": "", "ingredients": ["250 g strawberries, washed and dried well", "60 g dark chocolate, 90% cocoa", "1 tsp coconut oil"], "method": ["Line a plate with baking paper.", "Melt the chocolate with the coconut oil.", "Dip each strawberry halfway, let the extra drip off and put on the plate.", "Chill 15 minutes until set."], "tips": ["Raspberries are even lower in carbs if you want to swap."], "warnings": ["Strawberries have natural sugar. Stick to about 4 or 5 berries a serve."], "added": "2026-11-24"}]</script>

const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let picks=load("kk-picks",[]), got=load("kk-got",[]);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural=n=>n+(n===1?" recipe":" recipes");

function home(){
  return `<h1 class="ask">What would you like?</h1>`+["By meal","By type"].map(g=>`<p class="label">${g}</p><div class="tiles">${
    CATS.filter(c=>c.g===g).map(c=>`<button class="tile" data-go="${c.k}"><svg viewBox="0 0 48 48" aria-hidden="true">${ICON[c.i]}</svg><div><strong>${c.n}</strong><span>${plural(recipes.filter(c.f).length)}</span></div></button>`).join("")
  }</div>`).join("");
}
function rows(items){
  return items.length?`<ul class="rows">${items.map(r=>`<li><button data-go="r-${esc(r.id)}"><strong>${esc(r.name)}</strong><small>${(r.warnings||[]).length?'<span class="dot" aria-label="Has a note"></span>':""}${esc(r.time||"")} · Serves ${esc(r.servings)}${picks.includes(r.id)?' · <span class="on">On your list</span>':""}</small><span class="chev" aria-hidden="true">›</span></button></li>`).join("")}</ul>`:`<p class="empty">Nothing here yet.</p>`;
}
function cat(c){
  const items=recipes.filter(c.f);
  return `<button class="back" data-go="">← All categories</button><div class="ttl"><h2>${esc(c.n)}</h2><p>${plural(items.length)}</p></div>${rows(items)}`;
}
function recipe(r){
  const on=picks.includes(r.id);
  const link=r.source&&r.source.url?`<a href="${esc(r.source.url)}" target="_blank" rel="noopener">${esc(r.source.label||"Original")}</a>`:esc(r.source&&r.source.label||"");
  const c=CATS.find(c=>c.k===from);
  return `<button class="back" data-go="${c?c.k:""}">← ${c?esc(c.n):"All categories"}</button>
  <article class="recipe">
    <div class="ttl"><h2>${esc(r.name)}</h2><div class="facts"><span>${esc(r.time||"")}</span><span>Serves ${esc(r.servings)}</span><span>${(r.meal||[]).map(esc).join(", ")}</span></div></div>
    ${(r.warnings||[]).length?`<div class="warns">${r.warnings.map(w=>`<div class="warn">${esc(w)}</div>`).join("")}</div>`:""}
    <section class="sec"><h3>Ingredients</h3><ul class="ing">${(r.ingredients||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></section>
    <button class="add" data-add="${esc(r.id)}" aria-pressed="${on}">${on?"✓ On your shopping list":"Add to shopping list"}</button>
    <section class="sec"><h3>Method</h3><ol class="steps">${(r.method||[]).map(i=>`<li><span>${esc(i)}</span></li>`).join("")}</ol></section>
    ${(r.tips||[]).length?`<section class="sec"><h3>Tips</h3><ul class="tips">${r.tips.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></section>`:""}
    <p class="src">Source: ${link}</p>
  </article>`;
}
function shop(){
  const sel=recipes.filter(r=>picks.includes(r.id));
  const head=`<button class="back" data-go="">← All categories</button><div class="ttl"><h2>Shopping list</h2>`;
  if(!sel.length)return head+`<p>Empty for now. Open a recipe and tap “Add to shopping list”.</p></div>`;
  const seen=new Set(), items=[];
  sel.forEach(r=>(r.ingredients||[]).forEach(i=>{const k=i.toLowerCase();if(!seen.has(k)){seen.add(k);items.push(i);}}));
  return head+`<p>For ${sel.length} ${sel.length===1?"recipe":"recipes"}. Tick things off as you shop.</p></div>
    <ul class="items">${items.map((i,n)=>`<li><label><input type="checkbox" id="it-${n}" data-k="${esc(i.toLowerCase())}" ${got.includes(i.toLowerCase())?"checked":""}><span>${esc(i)}</span></label></li>`).join("")}</ul>
    <div class="btns"><button class="btn" id="copy">Copy list</button><button class="btn" id="clear">Clear list</button></div>
    <p class="label">Recipes on your list</p>${rows(sel)}`;
}
function route(){
  const h=location.hash.replace("#","");
  const ql=q.trim().toLowerCase();
  let html;
  if(ql){html=`<div class="ttl"><h2>Results</h2><p>for “${esc(q.trim())}”</p></div>`+rows(recipes.filter(r=>(r.name+" "+(r.ingredients||[]).join(" ")).toLowerCase().includes(ql)));}
  else if(h==="list")html=shop();
  else if(h.startsWith("r-")){const r=recipes.find(r=>r.id===h.slice(2));html=r?recipe(r):home();}
  else{const c=CATS.find(c=>c.k===h);if(c)from=c.k;else if(!h)from="";html=c?cat(c):home();}
  $("view").innerHTML=html;
  $("count").textContent=picks.length;
}
function go(k){
  if(q){q="";$("q").value="";}
  if(location.hash.replace("#","")===k)route();else location.hash=k;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});
$("view").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return;}
  const a=e.target.closest("[data-add]");
  if(a){const id=a.dataset.add;picks=picks.includes(id)?picks.filter(x=>x!==id):[...picks,id];save("kk-picks",picks);
    const on=picks.includes(id);a.setAttribute("aria-pressed",on);a.textContent=on?"✓ On your shopping list":"Add to shopping list";$("count").textContent=picks.length;return;}
  if(e.target.id==="clear"){picks=[];got=[];save("kk-picks",picks);save("kk-got",got);route();return;}
  if(e.target.id==="copy"){
    const lines=[...document.querySelectorAll(".items li")].filter(li=>!li.querySelector("input").checked).map(li=>"- "+li.textContent.trim());
    const btn=e.target;const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.querySelector(".items"));const s=getSelection();s.removeAllRanges();s.addRange(r);};
    try{navigator.clipboard.writeText("Shopping list\n"+lines.join("\n")).then(()=>{btn.textContent="Copied";setTimeout(()=>btn.textContent="Copy list",1500)},fallback)}catch(err){fallback()}
  }
});
$("view").addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;got=e.target.checked?[...new Set([...got,k])]:got.filter(x=>x!==k);save("kk-got",got);});
$("listBtn").onclick=()=>go("list");
$("q").addEventListener("input",e=>{q=e.target.value;route();});
recipes=JSON.parse($("recipe-data").textContent).sort((a,b)=>a.name.localeCompare(b.name));
route();
</script>

</body>
</html>
